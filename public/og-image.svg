    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="28"
    fill="#b7c5bd">Audit et remediation accessibilite</text>
  <text x="570" y="375"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="28"
    fill="#b7c5bd">RGAA 4.1 · WCAG 2.2 · European Accessibility Act</text>

  <!-- Trois pastilles marche -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600">
    <rect x="570" y="440" width="130" height="46" rx="23" fill="#0b5138" stroke="#82d4ab" stroke-width="2"/>
    <text x="635" y="470" fill="#82d4ab" text-anchor="middle">France</text>

    <rect x="720" y="440" width="180" height="46" rx="23" fill="#0b5138" stroke="#82d4ab" stroke-width="2"/>
