<?xml version="1.0" encoding="UTF-8"?>
<!-- Nuada — Open Graph 1200x630. Source de la generation de /public/og-image.png -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="ogtitle ogdesc">
  <title id="ogtitle">Nuada — Audit et remediation accessibilite</title>
  <desc id="ogdesc">L'auditeur qui code la solution. RGAA, WCAG 2.2, European Accessibility Act.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b5138"/>
      <stop offset="1" stop-color="#062e20"/>
    </linearGradient>
    <linearGradient id="silver" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="360" y2="360">
      <stop offset="0" stop-color="#e6eaef"/>
      <stop offset="0.5" stop-color="#8d97a1"/>
      <stop offset="1" stop-color="#c4cad1"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9dde2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d9dde2"/>
      <stop offset="1" stop-color="#d9dde2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Bord cuivre discret en haut -->
  <rect x="0" y="0" width="1200" height="6" fill="#7a3b10"/>

  <!-- Main d'argent (memes chemins que la brand de Base.astro, agrandis x11) -->
  <g transform="translate(140 155)">
    <path d="M55 192.5 a99 71.5 0 0 0 198 0 z" fill="url(#silver)"/>
    <g fill="url(#silver)">
      <rect x="54" y="123" width="28.6" height="80.3" rx="14.3"/>
      <rect x="96" y="79" width="28.6" height="124.3" rx="14.3"/>
      <rect x="140" y="61.6" width="28.6" height="141.9" rx="14.3"/>
      <rect x="184" y="77" width="28.6" height="126.5" rx="14.3"/>
      <rect x="226" y="114.4" width="28.6" height="89.1" rx="14.3"/>
    </g>
  </g>

  <!-- Filet argent horizontal -->
  <rect x="570" y="200" width="480" height="3" fill="url(#rule)"/>

  <!-- Wordmark Nuada -->
  <text x="570" y="180"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-size="118"
